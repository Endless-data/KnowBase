spring:
  application:
    name: knowbase
  datasource:
    url: ${KB_DB_URL:jdbc:mysql://localhost:3306/knowbase?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${KB_DB_USERNAME:knowbase}
    password: ${KB_DB_PASSWORD:knowbase}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

knowbase:
  storage:
    upload-dir: ${KB_UPLOAD_DIR:../uploads}
    max-file-size: 10485760
    allowed-extensions: txt,md
