spring:
  application:
    name: knowbase
  config:
    import:
      - optional:file:../.env[.properties]
  datasource:
    url: ${KB_DB_URL:jdbc:mysql://localhost:3306/knowbase?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${KB_DB_USERNAME:knowbase}
    password: ${KB_DB_PASSWORD:knowbase}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

knowbase:
  storage:
    upload-dir: ${KB_UPLOAD_DIR:../uploads}
    max-file-size: 10485760
    allowed-extensions: txt,md
  chunk:
    size: ${KB_CHUNK_SIZE:800}
    overlap: ${KB_CHUNK_OVERLAP:120}
  embedding:
    provider: ${KB_EMBEDDING_PROVIDER:dashscope}
    model: ${KB_EMBEDDING_MODEL:text-embedding-v4}
    dimension: ${KB_EMBEDDING_DIMENSION:1024}
  vector-store:
    provider: ${KB_VECTOR_STORE_PROVIDER:mysql}
  llm:
    provider: ${KB_LLM_PROVIDER:deepseek}
    model: ${KB_LLM_MODEL:deepseek-v4-flash}
    base-url: ${KB_LLM_BASE_URL:https://api.deepseek.com}
    max-tokens: ${KB_LLM_MAX_TOKENS:1000}
